
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Car Racing Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#111;color:white;
 font-family:Arial;text-align:center;
 overflow:hidden;
}
h2{padding:12px;color:#00eaff}
#game{
 width:100%;height:75vh;
 max-width:500px;margin:auto;
 position:relative;overflow:hidden;
 background:linear-gradient(#65c9ff,#b9eaff 35%,#397d29 35%);
 border:3px solid white;
}
#road{
 position:absolute;left:20%;width:60%;height:100%;
 background:#444;
}
.line{
 position:absolute;left:49%;width:3px;height:100%;
 background:repeating-linear-gradient(to bottom,white 0 40px,transparent 40px 80px);
 animation:road 0.5s linear infinite;
}
@keyframes road{to{background-position:0 80px}}
.car{
 position:absolute;bottom:20px;
 left:43%;width:55px;height:95px;
 background:#ed2020;border-radius:12px 12px 7px 7px;
 border:3px solid white;
 box-shadow:inset 0 20px #9eeaff;
}
.car:after{
 content:"";position:absolute;bottom:8px;
 left:5px;width:39px;height:20px;
 background:#222;border-radius:5px;
}
.enemy{
 position:absolute;width:55px;height:90px;
 background:#ffcc00;border:3px solid white;
 border-radius:12px;top:-100px;
}
#score{font-size:22px;padding:10px}
.controls{display:flex;justify-content:center;gap:35px;padding:12px}
button{
 padding:15px 30px;border:0;border-radius:12px;
 background:#00d9ff;font-size:22px;font-weight:bold;
}
#over{
 display:none;position:absolute;inset:0;
 background:#000c;z-index:5;
 align-items:center;justify-content:center;
 flex-direction:column;gap:20px;
}
</style>
</head>
<body>

<h2>🏎️ 3D CAR RACING GAME</h2>
<div id="score">Score: 0</div>

<div id="game">
 <div id="road"></div>
 <div class="line"></div>
 <div id="player" class="car"></div>
 <div id="over">
  <h1>GAME OVER!</h1>
  <h2 id="final"></h2>
  <button onclick="restart()">PLAY AGAIN</button>
 </div>
</div>

<div class="controls">
 <button onclick="move(-1)">⬅️</button>
 <button onclick="move(1)">➡️</button>
</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreText=document.getElementById("score");
const over=document.getElementById("over");

let lane=1,score=0,speed=5,running=true;
let enemies=[];

function position(){
 player.style.left=(20+lane*20+7.5)+"%";
}
function move(dir){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+dir));
 position();
}

function createEnemy(){
 if(!running)return;
 let e=document.createElement("div");
 e.className="enemy";
 let l=Math.floor(Math.random()*3);
 e.style.left=(20+l*20+7.5)+"%";
 game.appendChild(e);
 enemies.push({el:e,lane:l,y:-100});
}

function endGame(){
 running=false;
 over.style.display="flex";
 document.getElementById("final").innerText="Your Score: "+score;
}

function loop(){
 if(!running)return;

 enemies.forEach((e,i)=>{
  e.y+=speed;
  e.el.style.top=e.y+"px";

  if(e.lane===lane && e.y>game.clientHeight-130 && e.y<game.clientHeight-20){
   endGame();
  }

  if(e.y>game.clientHeight){
   e.el.remove();
   enemies.splice(i,1);
   score+=10;
   scoreText.innerText="Score: "+score;
   speed=Math.min(12,5+score/150);
  }
 });
 requestAnimationFrame(loop);
}

let timer;
function start(){
 timer=setInterval(createEnemy,1300);
 requestAnimationFrame(loop);
}

function restart(){
 enemies.forEach(e=>e.el.remove());
 enemies=[];
 lane=1;score=0;speed=5;running=true;
 scoreText.innerText="Score: 0";
 over.style.display="none";
 position();
 clearInterval(timer);
 start();
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
});

position();
start();
</script>
</body>
</html>
